<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0d0d1a"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffd54f" stroke-width="6" opacity="0.3"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffd54f" stroke-width="2" opacity="0.15"/>

  <!-- Sword blade -->
  <polygon points="256,80 244,270 256,285 268,270" fill="#e0e0e0"/>
  <polygon points="256,80 244,270 256,260 268,270" fill="#ffffff"/>

  <!-- Sword crossguard -->
  <rect x="200" y="272" width="112" height="18" rx="9" fill="#ffd54f"/>
  <ellipse cx="200" cy="281" rx="12" ry="9" fill="#ffca28"/>
  <ellipse cx="312" cy="281" rx="12" ry="9" fill="#ffca28"/>

  <!-- Sword grip -->
  <rect x="247" y="290" width="18" height="70" rx="9" fill="#8d6e63"/>
  <rect x="250" y="296" width="12" height="58" rx="6" fill="#a1887f"/>

  <!-- Pommel -->
  <circle cx="256" cy="375" r="16" fill="#ffd54f"/>
  <circle cx="256" cy="375" r="9"  fill="#ffca28"/>

  <!-- Star sparks -->
  <circle cx="190" cy="160" r="4" fill="#ffd54f" opacity="0.8"/>
  <circle cx="322" cy="140" r="3" fill="#ffd54f" opacity="0.6"/>
  <circle cx="175" cy="310" r="3" fill="#64b5f6" opacity="0.7"/>
  <circle cx="340" cy="290" r="4" fill="#69f0ae" opacity="0.6"/>
  <circle cx="210" cy="390" r="2.5" fill="#ffd54f" opacity="0.5"/>
  <circle cx="310" cy="380" r="2.5" fill="#ff6b6b" opacity="0.5"/>
</svg>
